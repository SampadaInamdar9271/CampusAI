<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusAI | Faculty Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 380px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(15, 23, 42, 0.12);
            text-align: center;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: auto;
            border-radius: 15px;
            background: #6366f1;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }

        h1 {
            margin: 20px 0 5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #6366f1;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #6366f1;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        #error {
            color: #dc2626;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            AI
        </div>

        <h1>Faculty Portal</h1>

        <div class="subtitle">
            GM UNIVERSITY • CampusAI
        </div>

        <input
            type="password"
            id="facultyPassword"
            placeholder="Enter faculty password"
            autocomplete="off"
        >

        <button onclick="loginFaculty()">
            🔐 Open Faculty Portal
        </button>

        <div id="error">
            Incorrect password. Please try again.
        </div>

        <a href="dashboard.html" class="back">
            ← Back to Student Portal
        </a>

    </div>


    <script>

        const FACULTY_PASSWORD = "GMU@Faculty26";

        function loginFaculty() {

            const password =
                document.getElementById("facultyPassword").value;

            const error =
                document.getElementById("error");

            if (password === FACULTY_PASSWORD) {

                sessionStorage.setItem(
                    "facultyAuthenticated",
                    "true"
                );

                window.location.href = "faculty.html";

            } else {

                error.style.display = "block";

            }
        }


        document
            .getElementById("facultyPassword")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    loginFaculty();
                }

            });

    </script>
  if (sessionStorage.getItem("facultyAuthenticated") !== "true") {
    window.location.href = "faculty-login.html";
}
</body>

</html>
